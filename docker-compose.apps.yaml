# Run all Quantyx apps in containers with host networking.
# Uses the same .env files as local development — no config duplication.
#
# Prerequisites:
#   1. Build all app images: npx nx run-many -t docker:build
#   2. Start infrastructure:  docker compose up -d
#   3. Start apps:            docker compose -f docker-compose.apps.yaml up -d

services:
  api-event-webhook:
    image: apps-api-event-webhook:latest
    container_name: quantyx-api-event-webhook
    network_mode: host
    env_file:
      - .env
      - apps/api-event-webhook/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=512

  consumer-events-ingest:
    image: apps-consumer-events-ingest:latest
    container_name: quantyx-consumer-events-ingest
    network_mode: host
    env_file:
      - .env
      - apps/consumer-events-ingest/.env

  api-tenant-manager:
    image: apps-api-tenant-manager:latest
    container_name: quantyx-api-tenant-manager
    network_mode: host
    env_file:
      - .env
      - apps/api-tenant-manager/.env

  api-analytics-bff:
    image: apps-api-analytics-bff:latest
    container_name: quantyx-api-analytics-bff
    network_mode: host
    env_file:
      - .env
      - apps/api-analytics-bff/.env

  interface-web:
    image: apps-interface-web:latest
    container_name: quantyx-interface-web
    network_mode: host
    env_file:
      - .env
      - apps/interface/web/.env
