server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo v2.10+ uses Kafka for the distributor->ingester ingest path.
# Connects to the Kafka instance from docker-compose.yaml on quantyx-net.
ingest:
  kafka:
    address: kafka:9092
    topic: tempo-ingest
    auto_create_topic_enabled: true

# Generates span metrics (service graphs, RED metrics) from traces and
# remote-writes them to Prometheus.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions:
        - http.method
        - http.route
        - db.system
    span_metrics:
      dimensions:
        - http.method
        - http.route
        - http.status_code
        - db.system
        - db.operation.name

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
